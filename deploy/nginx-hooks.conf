# Nginx config for Wata webhook endpoints
# hooks1.rugpay.ru / hooks2.rugpay.ru
#
# 1. Copy to server:  /etc/nginx/sites-available/hooks-rugpay
# 2. Symlink:         ln -s /etc/nginx/sites-available/hooks-rugpay /etc/nginx/sites-enabled/
# 3. Get SSL cert:    certbot --nginx -d hooks1.rugpay.ru -d hooks2.rugpay.ru
# 4. Test & reload:   nginx -t && systemctl reload nginx

upstream backend_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name hooks1.rugpay.ru hooks2.rugpay.ru;

    # Redirect HTTP -> HTTPS (Wata requires https://)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hooks1.rugpay.ru hooks2.rugpay.ru;

    # SSL — certbot will fill these in, or set manually:
    # ssl_certificate     /etc/letsencrypt/live/hooks1.rugpay.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hooks1.rugpay.ru/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Only allow webhook endpoint — block everything else
    location = /api/payments/webhook {
        proxy_pass http://backend_app/api/payments/webhook;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Wata signature header for RSA-SHA512 verification
        proxy_set_header X-Signature       $http_x_signature;

        # Webhook payloads are small, but give enough room
        client_max_body_size 1m;
        proxy_read_timeout   30s;
    }

    # Deny all other paths
    location / {
        return 404;
    }
}
