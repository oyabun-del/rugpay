<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{title}</title>
  </head>
  <body style="margin:0;padding:0;background:#0b1020;font-family:Arial,sans-serif;color:#e8ebff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#141a2e;border:1px solid #2a3358;border-radius:14px;overflow:hidden;">
            <tr>
              <td style="padding:24px 24px 8px;color:#9aa5d9;font-size:12px;">{preheader}</td>
            </tr>
            <tr>
              <td style="padding:0 24px 8px;font-size:26px;font-weight:700;color:#ffffff;">{heading}</td>
            </tr>
            <tr>
              <td style="padding:0 24px 6px;font-size:14px;color:#9aa5d9;">Сумма пополнения</td>
            </tr>
            <tr>
              <td style="padding:0 24px 14px;font-size:18px;font-weight:700;color:#ffffff;">{amount}</td>
            </tr>
            <tr>
              <td style="padding:0 24px 6px;font-size:14px;color:#9aa5d9;">Итого к оплате</td>
            </tr>
            <tr>
              <td style="padding:0 24px 20px;font-size:18px;font-weight:700;color:#ffffff;">{total}</td>
            </tr>
            <tr>
              <td style="padding:0 24px 24px;">
                <a href="{action_url}" style="display:inline-block;padding:12px 18px;background:#c6282e;color:#ffffff;text-decoration:none;border-radius:10px;font-weight:700;">{action_text}</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 24px;font-size:12px;color:#9aa5d9;">{footer_note}</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
